name: Build ArchiveTune

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        run: |
          GRADLEW=$(find . -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Cannot find gradlew"
            echo "Repository contents:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-Genius
          path: '**/build/outputs/apk/release/*.apk'
