name: Build ArchiveTune

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          unzip -q ArchiveTune-15.0.0-GeniusSynced.zip -d source
          echo "Source extracted:"
          find source -maxdepth 3 -type f -name "gradlew" -o -name "settings.gradle*" -o -name "build.gradle*"

      - name: Find Gradle project
        run: |
          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Cannot find gradlew after extracting ZIP"
            find source -maxdepth 4 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-Genius
          path: '**/build/outputs/apk/release/*.apk'      - name: Grant execute permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-Genius
          path: '**/build/outputs/apk/release/*.apk'
